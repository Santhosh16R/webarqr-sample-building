<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Floor launcher checks</title><style>body{font:14px Arial}iframe{width:390px;height:844px;border:1px solid #aaa}section{display:inline-block;vertical-align:top;margin:10px}</style></head><body><h1>Floor launcher checks</h1><p>Simulated capability checks only. These previews never open a camera or launch a native viewer.</p><section><h2>Android native</h2><iframe id="android" title="Android native launcher"></iframe></section><section><h2>iPhone native</h2><iframe id="iphone" title="iPhone native launcher"></iframe></section><section><h2>WebXR permission denied</h2><iframe id="webxr" title="WebXR launcher"></iframe></section><script type="module">

 const setup=`Object.defineProperty(navigator,'userAgent',{value:${JSON.stringify(mode==='android'?'Android test':'Test browser')},configurable:true});const supports=DOMTokenList.prototype.supports;DOMTokenList.prototype.supports=function(token){if(token==='ar')return ${mode==='iphone'};return supports.call(this,token);};Object.defineProperty(navigator,'xr',{value:${mode==='webxr'?"{isSessionSupported:async()=>true,requestSession:()=>Promise.reject(new DOMException('Simulated AR denial','NotAllowedError'))}":'undefined'},configurable:true});`;
 document.querySelector('#'+mode).srcdoc=html.replace('<head>','<head><base href="'+new URL('../docs/',location.href).href+'">').replace('<script type="module"', '<script>'+setup+'</'+'script><script type="module"');
}
</script></body></html>
